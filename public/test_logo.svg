<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500' width='500' height='500'>
  <defs>
    <!-- Rich Gold Metallic Gradient -->
    <linearGradient id='goldMetallic' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#FCE8BB'/>
      <stop offset='25%' stop-color='#E1BC6D'/>
      <stop offset='50%' stop-color='#C79C42'/>
      <stop offset='75%' stop-color='#E8CD82'/>
      <stop offset='100%' stop-color='#9E782F'/>
    </linearGradient>

    <!-- Dark Navy Background Gradient -->
    <radialGradient id='navyBg' cx='50%' cy='50%' r='70%'>
      <stop offset='0%' stop-color='#10233B'/>
      <stop offset='60%' stop-color='#0A1728'/>
      <stop offset='100%' stop-color='#050C16'/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width='500' height='500' fill='url(#navyBg)'/>

  <!-- Interlocking Serif D + D Monogram -->
  <g transform='translate(250, 250) scale(1.85)' text-anchor='middle'>
    <!-- Left D (Serif) -->
    <path d='
      M -60,-80
      L -10,-80
      C 35,-80 60,-55 60,0
      C 60,55 35,80 -10,80
      L -60,80
      L -60,62
      L -45,62
      L -45,-62
      L -60,-62
      Z
      M -28,-62
      L -10,-62
      C 22,-62 40,-42 40,0
      C 40,42 22,62 -10,62
      L -28,62
      Z
    ' fill='url(#goldMetallic)'/>

    <!-- Right D (Shifted Up & Right, Interlocking) -->
    <path d='
      M -20,-100
      L 30,-100
      C 75,-100 100,-75 100,-20
      C 100,35 75,60 30,60
      L -20,60
      L -20,42
      L -5,42
      L -5,-82
      L -20,-82
      Z
      M 12,-82
      L 30,-82
      C 62,-82 80,-62 80,-20
      C 80,22 62,42 30,42
      L 12,42
      Z
    ' fill='url(#goldMetallic)' opacity='0.96'/>
  </g>
</svg>