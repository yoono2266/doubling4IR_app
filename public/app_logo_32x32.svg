<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- Rich Gold Metallic Gradient matching attached image -->
    <linearGradient id="goldGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6"/>
      <stop offset="25%" stop-color="#E3BE6E"/>
      <stop offset="50%" stop-color="#B88D32"/>
      <stop offset="75%" stop-color="#E8CD82"/>
      <stop offset="100%" stop-color="#7A581A"/>
    </linearGradient>

    <!-- Dark Navy Background Gradient -->
    <radialGradient id="navyBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#112338"/>
      <stop offset="100%" stop-color="#08121E"/>
    </radialGradient>
  </defs>

  <!-- Dark Navy Square Background Canvas -->
  <rect width="256" height="256" fill="url(#navyBg)"/>

  <!-- Centered Interlocking Serif Double D Monogram -->
  <g transform="translate(128, 128) scale(0.68)">
    <!-- First (Left/Lower) Serif D -->
    <path d="
      M -110,-100
      L -30,-100
      C 45,-100 95,-60 95,0
      C 95,60 45,100 -30,100
      L -110,100
      L -110,80
      Q -90,80 -90,60
      L -90,-60
      Q -90,-80 -110,-80
      Z
      M -58,-76
      L -30,-76
      C 28,-76 66,-48 66,0
      C 66,48 28,76 -30,76
      L -58,76
      Z
    " fill="url(#goldGrad)"/>

    <!-- Second (Right/Upper) Interlocking Serif D -->
    <path d="
      M -40,-130
      L 40,-130
      C 115,-130 165,-90 165,-30
      C 165,30 115,70 40,70
      L -40,70
      L -40,50
      Q -20,50 -20,30
      L -20,-90
      Q -20,-110 -40,-110
      Z
      M 12,-106
      L 40,-106
      C 98,-106 136,-78 136,-30
      C 136,18 98,46 40,46
      L 12,46
      Z
    " fill="url(#goldGrad)" opacity="0.95"/>
  </g>
</svg>