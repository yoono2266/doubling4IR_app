<!DOCTYPE html>

<html class="dark" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Reservation History - Doubling</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100..900&amp;display=swap" rel="stylesheet"/>
<style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "#0D1B2A",
                        "surface": "#0D1B2A",
                        "surface-container": "#162639",
                        "primary": "#C5A059",
                        "primary-container": "#C5A059",
                        "on-primary": "#0D1B2A",
                        "on-primary-container": "#0D1B2A",
                        "tertiary": "#E2C28E",
                        "on-tertiary": "#0D1B2A",
                        "on-background": "#F8F9FA",
                        "on-surface": "#F8F9FA",
                        "on-surface-variant": "#F8F9FA",
                        "outline": "rgba(197, 160, 89, 0.2)",
                        "card-border": "rgba(255, 255, 255, 0.05)",
                        "error": "#ffb4ab",
                        "on-error": "#690005"
                    },
                    borderRadius: {
                        "sm": "0.125rem",
                        "DEFAULT": "0.25rem",
                        "md": "0.375rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "margin-desktop": "64px",
                        "section-gap": "80px",
                        "unit": "8px",
                        "gutter": "24px",
                        "margin-mobile": "20px",
                        "stack-lg": "32px",
                        "stack-sm": "8px",
                        "container-max": "1200px",
                        "stack-md": "16px"
                    },
                    fontFamily: {
                        "headline-lg-mobile": ["Pretendard"],
                        "label-lg": ["Pretendard"],
                        "body-md": ["Pretendard"],
                        "label-sm": ["Pretendard"],
                        "headline-lg": ["Pretendard"],
                        "headline-xl": ["Pretendard"],
                        "headline-md": ["Pretendard"],
                        "body-lg": ["Pretendard"]
                    },
                    fontSize: {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-xl": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen pb-safe antialiased">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 border-b border-card-border bg-white/10 backdrop-blur-[20px] h-16 flex justify-between items-center px-[20px]">
<button class="text-on-surface hover:bg-white/5 transition-colors p-2 -ml-2 rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined">arrow_back_ios</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold tracking-widest text-primary">예약 내역</h1>
<button class="text-on-surface hover:bg-white/5 transition-colors p-2 -mr-2 rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined">menu</span>
</button>
</header>
<!-- Main Content -->
<main class="pt-24 pb-28 px-[20px] max-w-container-max mx-auto w-full flex flex-col gap-stack-lg">
<!-- Reservation List -->
<div class="flex flex-col gap-stack-md">
<!-- Card 1: Confirmed -->
<article class="bg-surface-container rounded border border-card-border p-4 flex flex-col gap-3">
<div class="flex justify-between items-start">
<div>
<h2 class="font-body-lg text-body-lg text-on-surface font-semibold">Okada Manila</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Deluxe Room</p>
</div>
<span class="px-3 py-1 rounded font-label-sm text-label-sm bg-primary-container text-on-primary-container font-bold">확정</span>
</div>
<div class="flex items-center gap-2 text-on-surface-variant font-label-lg text-label-lg mt-2">
<span class="material-symbols-outlined text-[18px]">calendar_today</span>
<span>2024.11.15 - 2024.11.18</span>
</div>
</article>
<!-- Card 2: Completed (Grey/Outline) -->
<article class="bg-surface-container rounded border border-card-border p-4 flex flex-col gap-3 opacity-70">
<div class="flex justify-between items-start">
<div>
<h2 class="font-body-lg text-body-lg text-on-surface font-semibold">Solaire Resort</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Premium Suite</p>
</div>
<span class="px-3 py-1 rounded font-label-sm text-label-sm border border-outline text-on-surface-variant font-bold">종료</span>
</div>
<div class="flex items-center gap-2 text-on-surface-variant font-label-lg text-label-lg mt-2">
<span class="material-symbols-outlined text-[18px]">calendar_today</span>
<span>2024.09.01 - 2024.09.05</span>
</div>
</article>
<!-- Card 3: Cancelled (Error) -->
<article class="bg-surface-container rounded border border-card-border p-4 flex flex-col gap-3">
<div class="flex justify-between items-start">
<div>
<h2 class="font-body-lg text-body-lg text-on-surface font-semibold">City of Dreams</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Governor Suite</p>
</div>
<span class="px-3 py-1 rounded font-label-sm text-label-sm bg-error/20 text-error font-bold">취소</span>
</div>
<div class="flex items-center gap-2 text-on-surface-variant font-label-lg text-label-lg mt-2">
<span class="material-symbols-outlined text-[18px]">calendar_today</span>
<span>2024.07.20 - 2024.07.22</span>
</div>
</article>
</div>
</main>
<!-- Bottom Nav Bar -->
<nav class="fixed bottom-0 w-full z-50 border-t border-card-border bg-white/10 backdrop-blur-[20px] h-20 px-[20px] pb-safe flex justify-around items-center md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary/80 transition-all active:scale-90 duration-200 font-label-sm text-label-sm gap-1 w-16">
<span class="material-symbols-outlined">casino</span>
<span>잭팟</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary/80 transition-all active:scale-90 duration-200 font-label-sm text-label-sm gap-1 w-16">
<span class="material-symbols-outlined">query_stats</span>
<span>폴리</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary/80 transition-all active:scale-90 duration-200 font-label-sm text-label-sm gap-1 w-16">
<span class="material-symbols-outlined">home</span>
<span>홈</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary/80 transition-all active:scale-90 duration-200 font-label-sm text-label-sm gap-1 w-16">
<span class="material-symbols-outlined">redeem</span>
<span>Free</span>
</button>
<button class="flex flex-col items-center justify-center text-primary transition-all active:scale-90 duration-200 font-label-sm text-label-sm gap-1 w-16">
<span class="material-symbols-outlined">person</span>
<span>마이</span>
</button>
</nav>
</body></html>
