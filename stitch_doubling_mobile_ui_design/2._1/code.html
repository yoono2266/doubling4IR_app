<!DOCTYPE html><html class="dark" lang="ko" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>회원가입</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" type="text/css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100..900&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#0D1B2A",
                        "surface": "#0D1B2A",
                        "surface-container": "#162639",
                        "primary": "#C5A059",
                        "primary-container": "#C5A059",
                        "on-primary": "#0D1B2A",
                        "on-primary-container": "#0D1B2A",
                        "tertiary": "#E2C28E",
                        "on-tertiary": "#0D1B2A",
                        "on-background": "#F8F9FA",
                        "on-surface": "#F8F9FA",
                        "on-surface-variant": "#F8F9FA",
                        "outline": "rgba(197, 160, 89, 0.2)",
                        "card-border": "rgba(255, 255, 255, 0.05)",
                        "error": "#ffb4ab",
                        "on-error": "#690005"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.25rem",
                        "xl": "0.25rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "container-max": "1200px",
                        "unit": "8px",
                        "margin-desktop": "64px",
                        "section-gap": "80px",
                        "stack-md": "16px",
                        "margin-mobile": "20px",
                        "stack-sm": "8px",
                        "stack-lg": "32px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "body-lg": ["Pretendard"],
                        "label-lg": ["Pretendard"],
                        "headline-lg-mobile": ["Pretendard"],
                        "headline-lg": ["Pretendard"],
                        "body-md": ["Pretendard"],
                        "headline-md": ["Pretendard"],
                        "headline-xl": ["Pretendard"],
                        "label-sm": ["Pretendard"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-xl": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Pretendard', sans-serif; }
        .glass-panel {
            background: var(--surface-container);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
        }
    </style>
</head>
<body class="bg-background text-on-surface w-full min-h-screen flex justify-center">
<div class="w-full max-w-[390px] min-h-[844px] bg-background relative flex flex-col overflow-hidden">
<!-- Header -->
<header class="flex items-center h-16 px-margin-mobile border-b border-card-border bg-white/5 backdrop-blur-xl shrink-0">
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors -ml-2 rounded hover:bg-white/5 active:scale-95">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md flex-1 text-center pr-8">회원가입</h1>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto px-margin-mobile pt-stack-lg pb-[100px] flex flex-col gap-stack-lg">
<!-- Welcome Text -->
<div class="text-left">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-sm">기본 정보를<br>입력해주세요</h2>
<p class="font-body-md text-body-md text-on-surface-variant">DOUBLING의 모든 서비스를 이용하기 위해 필요합니다.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-stack-md">
<!-- Email -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant">이메일</label>
<input class="w-full bg-surface-container border-0 border-b border-primary/30 text-on-surface font-body-md text-body-md px-0 py-3 focus:ring-0 focus:border-primary transition-colors placeholder:text-on-surface-variant/50" placeholder="example@email.com" type="email">
</div>
<!-- Nickname -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant">닉네임</label>
<input class="w-full bg-surface-container border-0 border-b border-primary/30 text-on-surface font-body-md text-body-md px-0 py-3 focus:ring-0 focus:border-primary transition-colors placeholder:text-on-surface-variant/50" placeholder=" 사용하실 닉네임을 입력하세요" type="text">
</div>
<!-- Birthdate -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant">생년월일</label>
<div class="relative">
<input class="w-full bg-surface-container border-0 border-b border-primary/30 text-on-surface font-body-md text-body-md px-0 py-3 focus:ring-0 focus:border-primary transition-colors appearance-none" style="color-scheme: dark;" type="date">
<span class="material-symbols-outlined absolute right-0 top-3 text-on-surface-variant pointer-events-none" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<!-- Gender -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant">성별</label>
<div class="flex gap-stack-sm p-1 rounded bg-surface-container border border-card-border">
<label class="flex-1 text-center cursor-pointer">
<input checked="" class="peer sr-only" name="gender" type="radio" value="male">
<div class="py-2 rounded peer-checked:bg-primary/20 peer-checked:text-primary peer-checked:border-primary/50 border border-transparent font-body-md text-body-md text-on-surface-variant transition-all">남성</div>
</label>
<label class="flex-1 text-center cursor-pointer">
<input class="peer sr-only" name="gender" type="radio" value="female">
<div class="py-2 rounded peer-checked:bg-primary/20 peer-checked:text-primary peer-checked:border-primary/50 border border-transparent font-body-md text-body-md text-on-surface-variant transition-all">여성</div>
</label>
<label class="flex-1 text-center cursor-pointer">
<input class="peer sr-only" name="gender" type="radio" value="other">
<div class="py-2 rounded peer-checked:bg-primary/20 peer-checked:text-primary peer-checked:border-primary/50 border border-transparent font-body-md text-body-md text-on-surface-variant transition-all">선택안함</div>
</label>
</div>
</div>
<!-- Referral Code -->
<div class="flex flex-col gap-stack-sm mt-4">
<label class="font-label-lg text-label-lg text-on-surface-variant">추천인 코드 (선택)</label>
<input class="w-full bg-surface-container border-0 border-b border-primary/30 text-on-surface font-body-md text-body-md px-0 py-3 focus:ring-0 focus:border-primary transition-colors placeholder:text-on-surface-variant/50" placeholder=" 추천인 코드를 입력하세요" type="text">
</div>
</form>
<!-- Terms & Conditions -->
<div class="glass-panel rounded p-stack-md flex flex-col gap-stack-md mt-4">
<label class="flex items-center gap-3 cursor-pointer pb-stack-md border-b border-card-border">
<input class="w-5 h-5 rounded border-outline bg-transparent text-primary focus:ring-primary focus:ring-offset-background" type="checkbox">
<span class="font-headline-md text-body-lg font-bold text-on-surface">전체 동의하기</span>
</label>
<div class="flex flex-col gap-stack-sm">
<div class="flex items-center justify-between">
<label class="flex items-center gap-3 cursor-pointer">
<input class="w-4 h-4 rounded border-outline bg-transparent text-primary focus:ring-primary focus:ring-offset-background" type="checkbox">
<span class="font-body-md text-body-md text-on-surface-variant">[필수] 서비스 이용약관 동의</span>
</label>
<button class="text-on-surface-variant hover:text-primary">
<span class="material-symbols-outlined text-[18px]" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center gap-3 cursor-pointer">
<input class="w-4 h-4 rounded border-outline bg-transparent text-primary focus:ring-primary focus:ring-offset-background" type="checkbox">
<span class="font-body-md text-body-md text-on-surface-variant">[필수] 개인정보 수집 및 이용 동의</span>
</label>
<button class="text-on-surface-variant hover:text-primary">
<span class="material-symbols-outlined text-[18px]" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<div class="flex items-center justify-between">
<label class="flex items-center gap-3 cursor-pointer">
<input class="w-4 h-4 rounded border-outline bg-transparent text-primary focus:ring-primary focus:ring-offset-background" type="checkbox">
<span class="font-body-md text-body-md text-on-surface-variant">[선택] 마케팅 정보 수신 동의</span>
</label>
<button class="text-on-surface-variant hover:text-primary">
<span class="material-symbols-outlined text-[18px]" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</div>
</div>
</main>
<!-- Bottom Action -->
<div class="absolute bottom-0 w-full p-margin-mobile bg-gradient-to-t from-background via-background to-transparent pb-8 pt-12 z-10">
<button class="w-full h-14 bg-surface-container text-on-surface-variant font-label-lg text-label-lg rounded cursor-not-allowed flex items-center justify-center">
                가입하기
            </button>
</div>
</div>


</body></html>
