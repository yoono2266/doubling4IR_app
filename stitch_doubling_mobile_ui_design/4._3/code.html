                        홈으로

<script>
        function setStatus(state) {
            const icon = document.getElementById('status-icon');
            const text = document.getElementById('status-text');
            const desc = document.getElementById('status-desc');
            const action = document.getElementById('complete-action');
            const display = document.getElementById('status-display');

            icon.classList.remove('animate-pulse', 'animate-spin');
            action.classList.add('hidden');
            display.classList.remove('border-primary-container');

            if (state === 'waiting') {
                icon.innerText = 'hourglass_empty';
                icon.classList.add('animate-pulse');
                icon.classList.replace('text-primary-container', 'text-on-surface-variant');
                text.innerText = '입금 대기 중...';
                desc.innerText = '네트워크 상황에 따라 최대 10분이 소요될 수 있습니다.';
            } else if (state === 'checking') {
                icon.innerText = 'sync';
                icon.classList.add('animate-spin');
                icon.classList.replace('text-on-surface-variant', 'text-primary-container');
                text.innerText = '입금 확인 중...';
                desc.innerText = '블록체인 네트워크에서 트랜잭션을 확인하고 있습니다.';
            } else if (state === 'complete') {
                icon.innerText = 'check_circle';
                icon.classList.replace('text-on-surface-variant', 'text-primary-container');
                display.classList.add('border-primary-container');
                text.innerText = '결제 완료';
                desc.innerText = '';
                action.classList.remove('hidden');
            }
        }
    </script>
