<!DOCTYPE html>

<html class="dark" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Doubling - Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100..900&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "background": "#0D1B2A", "surface": "#0D1B2A", "surface-container": "#162639",
              "primary": "#C5A059", "primary-container": "#C5A059", "on-primary": "#0D1B2A",
              "on-primary-container": "#0D1B2A", "tertiary": "#E2C28E", "on-tertiary": "#0D1B2A",
              "on-background": "#F8F9FA", "on-surface": "#F8F9FA", "on-surface-variant": "#F8F9FA",
              "outline": "rgba(197, 160, 89, 0.2)", "card-border": "rgba(255, 255, 255, 0.05)",
              "error": "#ffb4ab", "on-error": "#690005"
            },
            "borderRadius": {
              "sm": "0.125rem", "DEFAULT": "0.25rem", "md": "0.375rem",
              "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"
            },
            "spacing": {
                    "margin-desktop": "64px",
                    "section-gap": "80px",
                    "unit": "8px",
                    "gutter": "24px",
                    "margin-mobile": "20px",
                    "stack-lg": "32px",
                    "stack-sm": "8px",
                    "container-max": "1200px",
                    "stack-md": "16px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Pretendard"],
                    "label-lg": ["Pretendard"],
                    "body-md": ["Pretendard"],
                    "label-sm": ["Pretendard"],
                    "headline-lg": ["Pretendard"],
                    "headline-xl": ["Pretendard"],
                    "headline-md": ["Pretendard"],
                    "body-lg": ["Pretendard"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "headline-xl": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
            }
          }
        }
      }
    </script>
<style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #0D1B2A;
            color: #F8F9FA;
        }
        
        .glass-header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .custom-input {
            background-color: #162639 !important;
            border: none !important;
            border-bottom: 1px solid #C5A059 !important;
            border-radius: 4px 4px 0 0 !important;
            color: #F8F9FA !important;
            padding: 12px 16px !important;
        }
        
        .custom-input:focus {
            box-shadow: none !important;
            outline: none !important;
            border-bottom-width: 2px !important;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        select.custom-input option {
            background-color: #162639;
            color: #F8F9FA;
        }
    </style>
</head>
<body class="min-h-screen pb-safe antialiased flex flex-col items-center bg-background text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 glass-header h-16 max-w-container-max mx-auto left-0 right-0">
<div class="flex justify-between items-center px-margin-mobile h-full">
<button aria-label="Go back" class="text-on-surface hover:bg-white/5 p-2 rounded transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back_ios_new">arrow_back_ios_new</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">프로필</h1>
<button aria-label="Menu" class="text-on-surface hover:bg-white/5 p-2 rounded transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-container-max flex-1 mt-16 px-[20px] pb-32">
<!-- Profile Image Section -->
<section class="flex flex-col items-center mt-12 mb-10">
<div class="relative group cursor-pointer">
<div class="w-32 h-32 rounded overflow-hidden border-2 border-primary/30 relative">
<img class="w-full h-full object-cover" data-alt="A cinematic, high-fashion portrait of an elegant individual in a subtle dark setting, illuminated by soft golden rim lighting. The composition is centered and symmetrical, exuding a premium, luxurious atmosphere consistent with a prestigious brand identity. The background is a deep, blurred navy blue." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA40N0R3lxBRs0UrIwwhWjlkaVMuNX_Nrq9bJY7vU-qlP2SSf_tVO65Oq6RTglo0KLVlkCxi37sV8_W8oniVOmFxvzeNybx0iT94t5RNM0At_vo4xa_8VLe8DkQt3HcZIx8Rgv2aa9NyGEK9FEezp4D15baNOMz23VH3Bj2kfpc8SK50hi3HMzNWEc0hQMGs0YI1gSTNkbH4iAMbbidIbT_DXccInufjwAxRcO4-qPuMNHUOgqL23aZIw"/>
<div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-white">photo_camera</span>
</div>
</div>
<button aria-label="Edit Profile Picture" class="absolute bottom-0 right-0 bg-primary text-background w-10 h-10 rounded-full flex items-center justify-center shadow-lg transform transition active:scale-90">
<span class="material-symbols-outlined" data-icon="edit" style="font-size: 20px;">edit</span>
</button>
</div>
</section>
<!-- Form Fields -->
<section class="flex flex-col gap-6 max-w-md mx-auto w-full">
<!-- Nickname -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="nickname">닉네임</label>
<div class="relative">
<input class="w-full custom-input font-body-md text-body-md rounded" id="nickname" placeholder="닉네임을 입력하세요" type="text" value="Kevin"/>
<button aria-label="Clear nickname" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-white">
<span class="material-symbols-outlined" style="font-size: 18px;">cancel</span>
</button>
</div>
</div>
<!-- Date of Birth -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="dob">생년월일</label>
<div class="relative">
<input class="w-full custom-input font-body-md text-body-md rounded" id="dob" style="color-scheme: dark;" type="date" value="1990-01-01"/>
</div>
</div>
<!-- Gender -->
<div class="flex flex-col gap-2">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="gender">성별</label>
<div class="relative">
<select class="w-full custom-input font-body-md text-body-md appearance-none rounded" id="gender">
<option disabled="" value="unselected">성별을 선택하세요</option>
<option selected="" value="male">남성</option>
<option value="female">여성</option>
<option value="other">기타</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
</section>
</main>
<!-- Bottom Fixed Action Area -->
<div class="fixed bottom-16 w-full max-w-container-max left-0 right-0 z-40 bg-gradient-to-t from-background to-transparent pt-8 pb-[32px] px-[20px]">
<button class="w-full max-w-md mx-auto block bg-primary text-background font-headline-md text-headline-md py-4 rounded-full hover:bg-opacity-90 active:scale-[0.98] transition-all shadow-lg font-bold">
            저장
        </button>
</div>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full max-w-container-max mx-auto left-0 right-0 z-50 bg-white/10 backdrop-blur-[20px] border-t border-card-border pb-safe">
<div class="flex justify-around items-center h-16 px-4">
<button class="flex flex-col items-center justify-center w-16 h-full text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">casino</span>
<span class="text-[10px] font-medium">잭팟</span>
</button>
<button class="flex flex-col items-center justify-center w-16 h-full text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">sports_esports</span>
<span class="text-[10px] font-medium">폴리</span>
</button>
<button class="flex flex-col items-center justify-center w-16 h-full text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="text-[10px] font-medium">홈</span>
</button>
<button class="flex flex-col items-center justify-center w-16 h-full text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">redeem</span>
<span class="text-[10px] font-medium">Free</span>
</button>
<button class="flex flex-col items-center justify-center w-16 h-full text-primary transition-colors">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="text-[10px] font-medium">마이</span>
</button>
</div>
</nav>
</body></html>
