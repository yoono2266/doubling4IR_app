<style>
        body {
            background-color: theme('colors.background-deep');
            color: theme('colors.on-surface');
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid theme('colors.card-border');
        }

        .gold-glow {
            box-shadow: 0 0 40px rgba(197, 160, 89, 0.15);
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .animate-scale-in {
            animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: scale(0.8);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
    </style>

<body class="h-screen w-full flex flex-col items-center justify-center relative overflow-hidden bg-background-deep selection:bg-primary-container selection:text-background-deep">

<div class="absolute inset-0 z-0 pointer-events-none flex items-center justify-center">
<div class="w-[300px] h-[300px] rounded-full bg-primary-container/10 blur-[100px]"></div>

<div class="flex-1"></div>

                </p>
</div>
</div>
<!-- Bottom Action Area -->
<div class="flex-1 flex flex-col justify-end animate-fade-in-up delay-300 pb-safe">
<button class="w-full h-14 bg-primary-container text-background-deep font-label-lg text-label-lg rounded-DEFAULT flex items-center justify-center hover:bg-primary-container/90 active:scale-[0.98] transition-all duration-200" type="button">
                시작하기
            </button>
</div>
</main>
<script>
        // Simple script to handle button click if needed later
        document.querySelector('button').addEventListener('click', () => {

            if (navigator.vibrate) navigator.vibrate(50);
